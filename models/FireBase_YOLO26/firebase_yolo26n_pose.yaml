# FireBase-YOLO26n-Pose Architecture Definition
# Novelty: High-Resolution P2-Micro Detection Head for Tiny Fire & Ground-Contact Localization
# 4 Detection Scales: P2 (stride 4, 1/4 res), P3 (stride 8), P4 (stride 16), P5 (stride 32)

nc: 1
kpt_shape: [1, 2] # 1 single keypoint: (x_norm, y_norm) for Fire Base Ground Contact Point
scale: n
scales:
  n: [0.50, 0.25, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2-P2/4  <-- P2 Feature map for micro fires
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]           # 5-P4/16
  - [-1, 2, C3k2, [512, True]]           # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]          # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]          # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]             # 9-P5/32
  - [-1, 2, C2PSA, [1024]]               # 10-P5/32

# Head (FPN top-down down to P2 + PAN bottom-up up to P5)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 11 (up to P4)
  - [[-1, 6], 1, Concat, [1]]                   # 12 cat with P4 (layer 6)
  - [-1, 2, C3k2, [512, True]]                  # 13 (P4)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 14 (up to P3)
  - [[-1, 4], 1, Concat, [1]]                   # 15 cat with P3 (layer 4)
  - [-1, 2, C3k2, [256, True]]                  # 16 (P3)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 17 (up to P2 - stride 4)
  - [[-1, 2], 1, Concat, [1]]                   # 18 cat with P2 (layer 2)
  - [-1, 2, C3k2, [128, True]]                  # 19 (P2 - Micro scale) -> Head 1

  - [-1, 1, Conv, [128, 3, 2]]                  # 20 (down to P3)
  - [[-1, 16], 1, Concat, [1]]                  # 21 cat with layer 16 (P3)
  - [-1, 2, C3k2, [256, True]]                  # 22 (P3 - Small scale) -> Head 2

  - [-1, 1, Conv, [256, 3, 2]]                  # 23 (down to P4)
  - [[-1, 13], 1, Concat, [1]]                  # 24 cat with layer 13 (P4)
  - [-1, 2, C3k2, [512, True]]                  # 25 (P4 - Medium scale) -> Head 3

  - [-1, 1, Conv, [512, 3, 2]]                  # 26 (down to P5)
  - [[-1, 10], 1, Concat, [1]]                  # 27 cat with layer 10 (P5)
  - [-1, 1, C3k2, [1024, True, 0.5, True]]      # 28 (P5 - Large scale) -> Head 4

  - [[19, 22, 25, 28], 1, Pose26, [nc, kpt_shape]] # 29 Detect on 4 scales: [P2, P3, P4, P5]
